name: atesto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install "ruff==0.16.1"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build wheel
        run: python -m pip wheel --no-deps -w /tmp/atesto-wheel .
      - name: Install wheel
        run: python -m pip install --force-reinstall /tmp/atesto-wheel/atesto-*.whl
      - name: Console script
        run: atesto --version

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -shellcheck= -color \
            .github/workflows/atesto.yml \
            .github/workflows/container.yml \
            .github/workflows/container-publish.yml \
            .github/workflows/release.yml \
            integrations/github-actions/atesto-gate.yml \
            integrations/ci/github-actions.yml
