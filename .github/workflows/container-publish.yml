name: container-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Atesto version published to PyPI
        required: true
        type: string
        default: "0.3.0"
      wheel_sha256:
        description: SHA-256 of the atesto wheel on PyPI
        required: true
        type: string
        default: "af42b934d2a533723856333ee242c3f521428a9c48028108894b08e0cee9b25f"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            ATESTO_VERSION=${{ inputs.version }}
            ATESTO_SHA256=${{ inputs.wheel_sha256 }}
          tags: |
            ghcr.io/guihirsch/atesto:${{ inputs.version }}
            ghcr.io/guihirsch/atesto:latest
