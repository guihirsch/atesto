name: release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Reproducible wheel: the release environment is pinned here (not in
      # pyproject.toml, so source builds stay permissive) and the timestamp is
      # fixed, so the sha256 in integrations/github-actions/atesto-gate.yml can
      # be reproduced from this tree. Rebuild with these settings and compare
      # before changing either value.
      - name: Pin build environment
        run: |
          python -m pip install \
            "build==1.6.1" \
            "setuptools==84.2.1" \
            "wheel==0.48.0"
      - name: Build sdist and wheel
        env:
          SOURCE_DATE_EPOCH: "1795651200"
        run: python -m build --no-isolation
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
