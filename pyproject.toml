[build-system]
# Permissive on purpose: source builds should not require the exact release
# backend. The reproducible wheel hash in
# integrations/github-actions/atesto-gate.yml is pinned by the build
# environment in .github/workflows/release.yml, not by this source tree.
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "atesto"
version = "0.2.0"
description = "Evidence gate for AI-written code: proof and review at the code head."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Atesto contributors" }]
keywords = ["evidence", "gate", "ai-agents", "ci", "review", "proof"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
atesto = "atesto.cli:main"

[project.urls]
Homepage = "https://github.com/guihirsch/atesto"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
atesto = ["schemas/*.json"]
